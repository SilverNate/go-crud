name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# A newer push to the same branch/PR cancels the older, now-useless run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    name: Format, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Disposable PostgreSQL for the integration tests. Credentials here protect an
    # ephemeral container that lives only for this job and is not reachable from outside.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskdb_test        # name must contain "test" (safety guard in the tests)
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d taskdb_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true                      # caches the module + build cache, keyed on go.sum

      - name: Verify formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # No TEST_DATABASE_URL here, so PostgreSQL integration tests are skipped:
      # this step is the fast, hermetic unit-test signal. -race is supported on ubuntu.
      - name: Unit tests (race detector)
        run: go test -race -count=1 ./...

      - name: Integration tests + coverage (PostgreSQL service)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/taskdb_test?sslmode=disable
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 1
          {
            echo "### Test coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  docker:
    name: Docker build and Compose smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Throwaway credentials, generated per run and never stored.
      - name: Create .env
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "LOG_LEVEL=info"
          } > .env

      - name: Build image and start the stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Smoke test CRUD through the container
        run: bash scripts/smoke.sh

      - name: Show container state and logs (on failure)
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
